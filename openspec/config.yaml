schema: spec-driven

# Project context (optional)
context: |
  EPIC-MN (https://epic-mn.com/): public showcase to get students
  excited about AI in IT, for career events. The student is the
  product owner and drives; Claude runs ALL OpenSpec mechanics via
  the CLI and narrates each step in plain language.
  Example #1 is the Zigzag Clubhouse (fictional venue; ALL data
  invented). Apps are local-only: static vanilla HTML/CSS/JS, no
  accounts, no backend, no online services, persistence via
  localStorage, with a restore control. Vibe: playful & flashy.
